[project]
name = "cf-polygon-mcp"
version = "1.0.0.dev0"
description = "Codeforces Polygon API 命令行客户端（面向 agent），附带 agent skill"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
]

[project.scripts]
cf-polygon = "cf_polygon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
